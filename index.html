<style>

  --accent:#5b78ff;--accentm:rgba(91,120,255,.14);--accentt:#8a9dff;--btn:#3550e8;--btnh:#4561f5;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--fg)}
.app{display:flex;height:100vh;overflow:hidden}
/* sidebar */
.side{width:232px;flex:none;background:var(--rail);border-right:1px solid var(--bsub);display:flex;flex-direction:column;padding:14px 10px}
.logo{display:flex;align-items:center;gap:8px;padding:2px 6px 14px}
.logo b{font-size:19px;letter-spacing:-.3px;color:#2945F2;font-weight:700}
.ws{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;background:var(--surface)}
.ws .sq{width:22px;height:22px;border-radius:6px;background:#3a2a12;color:#f5b041;display:grid;place-items:center;font-weight:700;font-size:11px}
.nav{flex:1;overflow:auto}
.ni{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;color:#bdbdbd;font-weight:500;margin-bottom:1px}
.ni:hover{background:var(--hover)}
.ni svg{color:var(--muted)}
.ni.on{background:var(--accentm);color:#fff}
.ni.on svg{color:var(--accentt)}
.new{margin-left:auto;font-size:10px;font-weight:600;color:var(--accentt);border:1px solid rgba(91,120,255,.4);border-radius:4px;padding:0 5px}
.sub{padding-left:34px;color:var(--muted);font-size:12.5px;padding-top:4px;padding-bottom:4px;border-radius:6px;display:flex;align-items:center;gap:7px}
.sub:hover{background:var(--hover)}
.sub.on{color:var(--fg)}
.sub i{width:7px;height:7px;border-radius:2px;display:inline-block}
.me{display:flex;align-items:center;gap:9px;padding:8px;border-top:1px solid var(--bsub);margin-top:8px}
/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.head{padding:14px 24px 0;border-bottom:1px solid var(--bsub)}
.crumb{color:var(--muted);font-size:12px}
.titlerow{display:flex;align-items:flex-start;gap:12px;margin-top:6px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.desc{color:var(--muted);margin-top:2px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.pri:hover{background:var(--btnh)}
.btn.ghost{border-color:transparent;background:transparent;color:#bdbdbd}
.btn.ghost:hover{background:var(--hover)}
.btn.ai{border-color:rgba(91,120,255,.45);color:var(--accentt);background:var(--accentm)}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#fff;border:2px solid var(--bg);position:relative;flex:none}
.avs .av+.av{margin-left:-7px}
.av.sm{width:22px;height:22px;font-size:9.5px;border-width:0}
.av .spk{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.tabs{display:flex;align-items:center;gap:2px;margin-top:14px}
.tab{display:flex;align-items:center;gap:6px;padding:8px 10px 10px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tools{display:flex;align-items:center;gap:6px;padding:10px 24px;border-bottom:1px solid var(--bsub)}
.search{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:6px;background:var(--input);border:1px solid var(--border);width:220px;color:var(--muted)}
.body{flex:1;overflow:auto;position:relative}
/* grid */
.grid{padding:16px 24px 40px;min-width:1000px}
.group{margin-bottom:22px}
.ghead{display:flex;align-items:center;gap:8px;padding:4px 0 8px;font-weight:600;font-size:14px}
.ghead .cnt{color:var(--muted);font-weight:400;font-size:12px}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:0 10px;height:34px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);border-right:1px solid var(--bsub);background:var(--surface);white-space:nowrap;overflow:hidden}
th .ti{display:inline-flex;align-items:center;gap:6px}
td{height:38px;padding:0 10px;border-bottom:1px solid var(--bsub);border-right:1px solid var(--bsub);background:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr.r:hover td{background:#1c1c1c}
td.strip,th.strip{width:6px;padding:0;border-right:0}
td.st{padding:0;position:relative}
.pill{display:flex;align-items:center;justify-content:center;height:100%;color:#fff;font-weight:500;font-size:12.5px;cursor:pointer}
.pill:hover{filter:brightness(1.1)}
.cb{width:14px;height:14px;border:1px solid var(--bstrong);border-radius:4px;display:inline-block;vertical-align:middle}
.co{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.co .ci{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:500;border:1px solid var(--border);background:#1e1e1e;color:#cfcfcf}
.bar{display:flex;align-items:center;gap:8px}
.bar .tr{flex:1;height:6px;border-radius:3px;background:#262626;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:3px}
.bar span{font-family:'JetBrains Mono',monospace;font-size:12px;width:22px;text-align:right}
.mut{color:var(--muted)}
.wk{display:flex;align-items:center;gap:7px}
.add td{color:var(--muted);background:transparent;border-bottom:1px solid var(--bsub)}
.foot td{background:transparent;border:0;height:34px}
.dist{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:0 2px}
.pop{position:absolute;z-index:30;background:var(--popover);border:1px solid var(--bstrong);border-radius:8px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);width:180px;display:grid;gap:4px}
.pop .pill{height:28px;border-radius:4px}
/* kanban */
.kan{display:flex;gap:10px;padding:16px 24px;align-items:flex-start;min-width:max-content}
.col{width:196px;flex:none;background:#141414;border:1px solid var(--bsub);border-radius:8px;padding:8px}
.col.over{border-color:var(--accent);background:#161a2a}
.colh{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.card{background:var(--popover);border:1px solid var(--border);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:grab}
.card:hover{border-color:var(--bstrong)}
.card .row{display:flex;align-items:center;gap:6px;margin-top:8px}
/* calendar */
.cal{padding:16px 24px}
.calh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calh h2{font-size:16px;margin:0;font-weight:600}
.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{padding:5px 12px;color:var(--muted)}
.seg button.on{background:var(--hover);color:var(--fg)}
.month{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);border-left:1px solid var(--border);border-radius:8px;overflow:hidden}
.dow{padding:8px 10px;color:var(--muted);font-size:12px;background:var(--surface);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.day{min-height:112px;padding:6px 6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface)}
.day.out{background:#131313;color:var(--dis)}
.dn{font-size:12px;margin:0 0 4px 4px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.today .dn{background:var(--accent);color:#fff;font-weight:600}
.chip{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 6px;border-radius:4px;margin-bottom:3px;background:#202020;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
/* timeline */
.tl{padding:16px 24px;min-width:1000px}
.tlg{display:grid;grid-template-columns:220px 1fr;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.tln{padding:0 12px;height:36px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bsub);border-right:1px solid var(--border)}
.tlr{position:relative;height:36px;border-bottom:1px solid var(--bsub)}
.tlb{position:absolute;top:8px;height:20px;border-radius:5px;color:#fff;font-size:11.5px;font-weight:500;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
/* form */
.form{max-width:620px;margin:28px auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.form .fh{padding:22px 26px;border-bottom:1px solid var(--border);background:linear-gradient(0deg,#161616,#161a2a)}
.fl{display:block;font-weight:500;margin:0 0 6px}
.fi{width:100%;height:36px;border-radius:6px;background:var(--input);border:1px solid var(--border);padding:0 10px;color:var(--fg)}
.toggle{width:32px;height:18px;border-radius:9px;background:var(--accent);position:relative;display:inline-block}
.toggle:after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}
/* dashboard */
.dash{padding:16px 24px 40px;display:grid;grid-template-columns:repeat(12,1fr);gap:12px;min-width:1000px}
.w{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.w h3{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.w h3 .mut{font-weight:400;font-size:12px}
.num{font-size:28px;font-weight:600;letter-spacing:-.5px}
.delta{font-size:12px;color:var(--green)}
/* panels */
.panel{position:absolute;top:0;right:0;bottom:0;width:380px;background:var(--surface);border-left:1px solid var(--border);z-index:40;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.35)}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.pb{flex:1;overflow:auto;padding:16px}
.msgu{background:#262626;border-radius:12px;padding:10px 12px;margin-left:36px;margin-bottom:16px}
.step{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--bsub)}
.ok{width:16px;height:16px;border-radius:50%;background:rgba(34,197,94,.15);color:var(--green);display:grid;place-items:center;flex:none}
.composer{margin:12px 16px 16px;border:1px solid var(--border);border-radius:12px;background:#232323;padding:10px 12px;color:var(--muted);display:flex;align-items:flex-end;gap:8px;min-height:68px}
.kv{display:grid;grid-template-columns:120px 1fr;row-gap:12px;align-items:center}
.kv .k{color:var(--muted)}
.upd{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;background:#1b1b1b}
.x{color:var(--muted);width:28px;height:28px;border-radius:6px;display:grid;place-items:center}
.x:hover{background:var(--hover)}
@media (max-width:1500px){html{zoom:.85}.app{height:117.65vh}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:5px}

function BarChart({items}){

 const W=520,H=220,L=96,max=4;
 return <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
  {[0,1,2,3,4].map(v=><g key={v}><line x1={L+v*(W-L-20)/max} x2={L+v*(W-L-20)/max} y1={4} y2={H-22} stroke="#242424"/><text x={L+v*(W-L-20)/max} y={H-6} fill="#828282" fontSize="11" textAnchor="middle">{v}</text></g>)}
  {tr.map(([t,n],i)=><g key={t}><text x={L-10} y={20+i*27} fill="#cfcfcf" fontSize="12" textAnchor="end" dominantBaseline="middle">{t}</text>
   <rect x={L} y={11+i*27} width={n*(W-L-20)/max} height={18} rx={3} fill="#5b78ff"/>
   <text x={L+n*(W-L-20)/max+6} y={20+i*27} fill="#e6e6e6" fontSize="11.5" dominantBaseline="middle">{n}</text></g>)}
 </svg>;
}
function Donut({items}){
 const tot=items.length;let a=-Math.PI/2;const R=70,r=46,cx=90,cy=90;
 const seg=STATUSES.map(s=>{const n=items.filter(i=>i.status===s).length;const a0=a;a+=n/tot*2*Math.PI;return [s,n,a0,a]}).filter(x=>x[1]);
 const arc=(a0,a1)=>{const g=0.02;a0+=g;a1-=g;const L=a1-a0>Math.PI?1:0;const p=(rr,an)=>[cx+rr*Math.cos(an),cy+rr*Math.sin(an)];const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);return `M${x0} ${y0}A${R} ${R} 0 ${L} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${L} 0 ${x3} ${y3}Z`};
 return <div style={{display:"flex",alignItems:"center",gap:18}}><svg width="180" height="180">{seg.map(([s,n,a0,a1])=><path key={s} d={arc(a0,a1)} fill={ST[s]}/>)}
  <text x={cx} y={cy-4} textAnchor="middle" fill="#e6e6e6" fontSize="22" fontWeight="600">{tot}</text><text x={cx} y={cy+15} textAnchor="middle" fill="#828282" fontSize="11">prospects</text></svg>
  <div style={{display:"grid",gap:7}}>{seg.map(([s,n])=><div key={s} style={{display:"flex",alignItems:"center",gap:8}}><span className="dot" style={{background:ST[s]}}/><span style={{width:96}}>{s}</span><b style={{fontWeight:500}}>{n}</b></div>)}</div></div>;
}
function Line(){
 const d=[3,5,4,7,6,9,8,12],lab=["Sep 27","Oct 4","Oct 11","Oct 18","Oct 25","Nov 1","Nov 8","Nov 15"];
 const W=520,H=210,L=30,B=26,T=10,mx=12;const x=i=>L+i*(W-L-30)/7,y=v=>T+(H-T-B)*(1-v/mx);
 const pts=d.map((v,i)=>x(i)+","+y(v)).join(" ");
 return <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
  {[0,4,8,12].map(v=><g key={v}><line x1={L} x2={W-8} y1={y(v)} y2={y(v)} stroke="#242424"/><text x={L-8} y={y(v)} fill="#828282" fontSize="11" textAnchor="end" dominantBaseline="middle">{v}</text></g>)}
  <polygon points={`${x(0)},${y(0)} ${pts} ${x(7)},${y(0)}`} fill="rgba(91,120,255,.12)"/>
  <polyline points={pts} fill="none" stroke="#5b78ff" strokeWidth="2.2"/>
  {d.map((v,i)=><circle key={i} cx={x(i)} cy={y(v)} r={3.2} fill="#161616" stroke="#5b78ff" strokeWidth="2"/>)}
  {lab.map((l,i)=><text key={l} x={x(i)} y={H-6} fill="#828282" fontSize="11" textAnchor="middle">{l}</text>)}
 </svg>;
}

 return <div className="panel" style={{width:420}}>
  <div className="ph"><Co it={it}/><span className="sp"/><button className="x" onClick={onClose}><I d={P.x} s={16}/></button></div>
  <div className="pb">
   <div className="kv">
    <span className="k">Status</span><span><span className="tag" style={{background:ST[it.status],border:0,color:"#fff"}}>{it.status}</span></span>
    <span className="k">Trade</span><span><Trade t={it.trade}/></span>
    <span className="k">Owner</span><span>{it.owner}</span>
    <span className="k">Intent score</span><Bar v={it.intent}/>
    <span className="k">Revenue band</span><span>{it.rev}</span>
    <span className="k">Next step</span><span>{nd(it.day)} · {it.next}</span>
    <span className="k">Assigned worker</span><div className="wk"><Av name={it.worker} sm ai/>{it.worker}</div>
    <span className="k">Contact</span><span style={{color:"#8a9dff"}}>{it.owner} in Contacts</span>
   </div>
   <div style={{fontWeight:600,marginTop:24}}>Updates</div>
   <div className="upd"><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><Av name="Ashley" sm ai/><b style={{fontWeight:500}}>Ashley</b><span className="mut" style={{fontSize:12}}>2 hours ago</span></div>{it.owner.split(" ")[0]} replied to the text and asked for a call next week. I moved the status and set the next step.</div>
   <div className="upd"><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span className="av sm" style={{background:"#334155"}}>RO</span><b style={{fontWeight:500}}>Ralph Oliver</b><span className="mut" style={{fontSize:12}}>Yesterday</span></div>Good fit. Lead with the iMessage numbers when we talk.</div>
   <div className="composer" style={{margin:"14px 0 0",minHeight:52}}><span style={{flex:1}}>Write an update</span></div>
  </div>
 </div>;
}

const VIEWS=[["grid","Grid","grid"],["kanban","Kanban","kan"],["calendar","Calendar","cal"],["timeline","Timeline","tl"],["form","Form","form"],["dashboard","Dashboard","chart"]];
function App(){
 const h=location.hash.slice(1).split("-");
 const [view,setView]=useState(VIEWS.some(v=>v[0]===h[0])?h[0]:"grid");
 const [ai,setAi]=useState(h.includes("ai"));
 const [open,setOpen]=useState(h.includes("item")?ITEMS0[0]:null);
 const [items,setItems]=useState(ITEMS0);
 useEffect(()=>{history.replaceState(null,"","#"+view+(ai?"-ai":""))},[view,ai]);
 const openItem=it=>{setAi(false);setOpen(it)};
 return <div className="app"><Sidebar/>
  <main className="main">
   <div className="head">
    <div className="crumb">Boards <span style={{margin:"0 4px"}}>/</span> <span style={{color:"#cfcfcf"}}>Blue Collar Prospects</span></div>
    <div className="titlerow"><div><h1>Blue Collar Prospects <I d={P.star} s={16} c="#eab308"/></h1><div className="desc">Owner prospects for hiublue growth partner outreach</div></div><span className="sp"/>
     <div className="avs" style={{marginTop:2}}><span className="av" style={{background:"#334155"}}>RO</span><Av name="Ashley" ai/><Av name="Yoli" ai/><Av name="Marco" ai/></div>
     <button className="btn"><I d={P.share} s={14}/>Share</button>
     <button className="btn ai" onClick={()=>{setOpen(null);setAi(!ai)}}><I d={P.spark} s={14}/>Ask Ashley</button></div>
    <div className="tabs">{VIEWS.map(([k,l,ic])=><button key={k} className={"tab"+(view===k?" on":"")} onClick={()=>setView(k)}><I d={P[ic]} s={14}/>{l}</button>)}
     <button className="tab"><I d={P.plus} s={14}/>View</button></div>
   </div>
   <div className="tools"><div className="search"><I d={P.search} s={14}/>Search this board</div>
    <button className="btn ghost"><I d={P.filter} s={14}/>Filter</button><button className="btn ghost"><I d={P.sort} s={14}/>Sort</button>
    <button className="btn ghost"><I d={P.layers} s={14}/>Group by: Status</button><button className="btn ghost"><I d={P.eye} s={14}/>Hide fields</button>
    <span className="sp"/>{view==="dashboard"?<><button className="btn">Edit layout</button><button className="btn pri"><I d={P.plus} s={14}/>Add widget</button></>:<button className="btn pri"><I d={P.plus} s={14}/>New item</button>}</div>
   <div className="body">
    {view==="grid"&&<Grid items={items} setItems={setItems} onOpen={openItem}/>}
    {view==="kanban"&&<Kanban items={items} setItems={setItems} onOpen={openItem}/>}
    {view==="calendar"&&<Calendar items={items} onOpen={openItem}/>}
    {view==="timeline"&&<Timeline items={items} onOpen={openItem}/>}
    {view==="form"&&<Form/>}
    {view==="dashboard"&&<Dashboard items={items}/>}
   </div>
  </main>
  {ai&&<div style={{position:"fixed",top:0,right:0,bottom:0,width:380,zIndex:50}}><AIPanel onClose={()=>setAi(false)}/></div>}
  {open&&<div style={{position:"fixed",top:0,right:0,bottom:0,width:420,zIndex:50}}><Drawer it={open} onClose={()=>setOpen(null)}/></div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
